<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#2a3fc9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1a6b" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS 图标网格：824×824 圆角方块，四周留 100px -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="4"/>
  <g filter="url(#sh)">
    <rect x="262" y="520" width="140" height="250" rx="34" fill="url(#bar)" opacity=".82"/>
    <rect x="442" y="390" width="140" height="380" rx="34" fill="url(#bar)"/>
    <rect x="622" y="600" width="140" height="170" rx="34" fill="url(#bar)" opacity=".65"/>
  </g>
  <!-- 第一名上方的星 -->
  <path filter="url(#sh)" fill="#ffd34d" d="M512 222 L539 285 L607 291 L556 336 L571 403 L512 368 L453 403 L468 336 L417 291 L485 285 Z" transform="translate(0,-34)"/>
</svg>
