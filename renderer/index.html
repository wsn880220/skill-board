<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Skill Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="side-top" data-tauri-drag-region></div>
      <div class="brand">Skill Board</div>
      <nav id="cats"></nav>
      <div class="side-foot" id="foot"></div>
    </aside>
    <main class="main">
      <header class="bar" data-tauri-drag-region>
        <div class="search no-drag">
          <svg viewBox="0 0 20 20" width="14" height="14"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="搜索名称或描述…" autocomplete="off">
        </div>
        <div class="seg no-drag" id="order">
          <button data-order="desc" class="on">使用最多</button>
          <button data-order="asc">使用最少</button>
        </div>
        <button class="icon-btn no-drag" id="rescan" title="重新扫描">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn no-drag" id="open-settings" title="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </header>
      <div class="notice" id="notice" hidden></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th class="c-rank">#</th><th class="c-name">名称</th><th>描述</th><th class="c-cat">分类</th><th class="c-num">次数</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>没有匹配的 skill</div>
      </div>
    </main>
  </div>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>设置</h2>
      <p class="hint">用 DeepSeek 把 skill 描述翻译成中文并自动分类。填好 key 保存后会立即开始处理，之后只处理新出现或改动过的 skill。</p>
      <label>API Key
        <input id="s-key" type="password" placeholder="sk-…" autocomplete="off">
      </label>
      <label>接口地址
        <input id="s-base" type="text">
      </label>
      <label>模型
        <input id="s-model" type="text">
      </label>
      <label>领域列表（每行一个，顺序就是左栏的顺序）
        <textarea id="s-cats" rows="8"></textarea>
      </label>
      <p class="hint small">删掉某个领域后，原来属于它的 skill 会自动重新分类；手动编辑过的 skill 不会被改动。</p>
      <div class="actions">
        <button value="cancel" formnovalidate>取消</button>
        <button value="save" class="primary" id="s-save">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit">
    <form method="dialog" id="edit-form">
      <h2 id="e-name"></h2>
      <p class="hint" id="e-en"></p>
      <label>中文描述
        <textarea id="e-zh" rows="3"></textarea>
      </label>
      <label>分类
        <select id="e-cat"></select>
      </label>
      <p class="hint small" id="e-msg"></p>
      <div class="actions">
        <button type="button" id="e-regen" class="left">让 AI 重新生成</button>
        <button value="cancel" formnovalidate>取消</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
